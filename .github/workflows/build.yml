name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Build the driver package
        shell: powershell
        run: .\driver\build.ps1

      # The package stays unsigned, install.ps1 signs it on the user's machine.
      - name: Pack
        shell: powershell
        run: >
          Compress-Archive -DestinationPath WinStadia.zip -Path
          driver\out\pkg, driver\install.ps1, driver\status.ps1, README.md, LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: WinStadia
          path: WinStadia.zip

      # Lets anyone check that the download was built here from this commit.
      - uses: actions/attest-build-provenance@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: WinStadia.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME WinStadia.zip --generate-notes
